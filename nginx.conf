# http-context directive: this file is included from inside `http` in the
# image's main nginx.conf, so it must sit outside the server block.
log_format proxied '$http_x_forwarded_for - $remote_user [$time_local] '
                   '"$request" $status $body_bytes_sent '
                   '"$http_referer" "$http_user_agent"';

server {
    listen 8021;
    listen [::]:8021;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # This container sits behind an upstream proxy that terminates TLS and
    # routes /api/v1 -> zenible-api and /api/zbi/v1 -> zbi-api. The frontend
    # calls those on absolute URLs, so nothing is proxied from here.

    # Log the real client, not the proxy hop.
    access_log /var/log/nginx/access.log proxied;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        font/woff
        font/woff2;

    # Liveness probe for the compose healthcheck.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Hashed build output: safe to cache forever. A missing asset must 404
    # rather than fall through to index.html, otherwise a stale client asking
    # for a deleted chunk gets HTML and fails with a confusing MIME error.
    location /assets/ {
        try_files $uri =404;
        # Set max-age via add_header only; `expires` would emit a second,
        # competing Cache-Control header alongside this one.
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Embeddable booking widget: filename is stable (not content-hashed) and
    # third-party sites script-tag it, so keep the TTL short so fixes land.
    location /call-widget/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=300";
        add_header Access-Control-Allow-Origin "*";
    }

    # Marketing images shipped from public/landing.
    location /landing/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # The SPA shell must never be cached, or deploys will not reach clients
    # that still hold the previous index.html and its dead asset hashes.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "SAMEORIGIN";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
    }

    # Client-side routing fallback. Deliberately no error_page 404 -> index.html:
    # that would resurrect the asset 404s the blocks above exist to preserve.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
